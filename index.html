<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Normalization for GitHub Pages on mobile browsers: ensures trailing slash for correct relative asset loading -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          var parts = p.split('/').filter(Boolean);
          if (parts.length === 1 && !p.endsWith('/')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>

    <title>
      AR Solution Home Tutor - Find the Right Tutor for Your Child
    </title>

    <meta
      name="description"
      content="Personalised home and online tuition for Classes 1–12 across CBSE, ICSE, and Maharashtra State Board. Explore subjects, understand the syllabus, and connect with verified teachers."
    />

    <meta
      name="theme-color"
      content="#F8FAFC"
    />

    <meta
      property="og:title"
      content="AR Solution Home Tutor - Find the Right Tutor for Your Child"
    />

    <meta
      property="og:description"
      content="Personalised home and online tuition for Classes 1–12 across CBSE, ICSE, and Maharashtra State Board. Explore subjects, understand the syllabus, and connect with verified teachers."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://arhuse8.github.io/ARSolution/"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-indigo-100 selection:text-indigo-900 font-['Plus_Jakarta_Sans',sans-serif]"
  >
    <div id="root"></div>

    <!-- Fallback if repository root is served on GitHub Pages without Vite build step -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var isDev = window.location.port === '3000' || window.location.port === '5173';
          var isRawTsx = document.querySelector('script[src*="/src/main.tsx"]');
          if (!isDev && isRawTsx) {
            var curr = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
            if (!curr.includes('/docs/')) {
              window.location.replace(curr + 'docs/' + window.location.search + window.location.hash);
            }
          }
        }
      })();
    </script>

    <!-- React application entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
