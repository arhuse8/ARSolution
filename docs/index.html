<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Trailing slash normalization for GitHub Pages on mobile & desktop browsers -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          var last = p.split('/').pop();
          if (!p.endsWith('/') && (!last || !last.includes('.'))) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>

    

    <title>
      AR Solution Home Tutor - Find the Right Tutor for Your Child
    </title>

    <meta
      name="description"
      content="Personalised home and online tuition for Classes 1–12 across CBSE, ICSE, and Maharashtra State Board. Explore subjects, understand the syllabus, and connect with verified teachers."
    />

    <meta
      name="theme-color"
      content="#F8FAFC"
    />

    <meta
      property="og:title"
      content="AR Solution Home Tutor - Find the Right Tutor for Your Child"
    />

    <meta
      property="og:description"
      content="Personalised home and online tuition for Classes 1–12 across CBSE, ICSE, and Maharashtra State Board. Explore subjects, understand the syllabus, and connect with verified teachers."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://arhuse8.github.io/ARSolution/"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>

  <body
    class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-indigo-100 selection:text-indigo-900 font-['Plus_Jakarta_Sans',sans-serif]"
  >
    <div id="root"></div>

    <!-- Production Bundle Loader for GitHub Pages root hosting (runs if redirect is bypassed) -->
    <script>
      (function() {
        var isLocalDev = window.location.hostname === 'localhost' ||
                         window.location.hostname === '127.0.0.1' ||
                         window.location.port === '3000' ||
                         window.location.port === '5173' ||
                         window.location.hostname.endsWith('.run.app');

        if (!isLocalDev && window.location.hostname.endsWith('github.io')) {
          // Ensure stylesheet is loaded
          if (!document.querySelector('link[href*="index.css"]')) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = './assets/index.css';
            document.head.appendChild(l);
          }
          // Load production JS bundle dynamically
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = '';
          s.src = './assets/index.js';
          document.head.appendChild(s);
        }
      })();
    </script>

    <!-- React application entry point (transformed by Vite in dev and during build) -->
  </body>
</html>
