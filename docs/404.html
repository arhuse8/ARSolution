<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Solution Home Tutor</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var pathParts = l.pathname.split('/').filter(Boolean);
        var repoName = pathParts.length > 0 ? pathParts[0] : '';
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + (repoName ? repoName + '/' : '');
        l.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 40px; color: #1e293b; background: #f8fafc;">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">AR Solution Home Tutor</h2>
    <p style="color: #64748b; font-size: 14px;">Redirecting you to the home page...</p>
    <p style="margin-top: 16px;"><a href="./" style="display: inline-block; padding: 10px 20px; background: #4f46e5; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">Click here if not redirected</a></p>
  </body>
</html>
